spring:
  application:
    name: ad-admin-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      repositories:
        enabled: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${SERVER_PORT:8481}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

cloud:
  aws:
    region:
      static: ${AWS_REGION:ap-northeast-2}
    credentials:
      access-key: ${AWS_IAM_ACCESS_KEY:}
      secret-key: ${AWS_IAM_SECRET_KEY:}

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
