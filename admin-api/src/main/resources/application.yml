spring:
  application:
    name: ad-admin-api
  profiles:
    default: local
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  data:
    redis:
      repositories:
        enabled: false

server:
  port: ${SERVER_PORT:8481}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never

app:
  admin:
    allowed-origins: ${ADMIN_ALLOWED_ORIGINS:}
    access-token-minutes: ${ADMIN_ACCESS_TOKEN_MINUTES:30}

springdoc:
  swagger-ui:
    enabled: false

logging:
  level:
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
