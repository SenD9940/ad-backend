spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useUnicode=true&sslMode=${DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  lifecycle:
    timeout-per-shutdown-phase: 30s

aes:
  key:
    personal-data-key: ${AES_PERSONAL_DATA_KEY}
    search-hmac-key: ${AES_SEARCH_HMAC_KEY}
token:
  secret:
    key: ${TOKEN_SECRET_KEY}

app:
  aws:
    s3:
      key-prefix: ${S3_KEY_PREFIX:ad-backend}
      bucket: ${S3_BUCKET_NAME:}
  ai-studio:
    openai:
      api-key: ${app.ai-creative.api-key:${OPEN_API_KEY:${OPENAI_API_KEY:}}}
      text-model: ${OPENAI_TEXT_MODEL:gpt-4o-mini}
  admin:
    allowed-origins: ${ADMIN_ALLOWED_ORIGINS:}
    access-token-minutes: ${ADMIN_ACCESS_TOKEN_MINUTES:30}
