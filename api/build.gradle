plugins {
    id 'java'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
}

group = 'com.orinan'
version = '1.0-SNAPSHOT'

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

ext {
    springCloudAwsVersion = '4.0.2'
    springdocVersion = '3.0.3'
    jjwtVersion = '0.13.0'
    firebaseAdminVersion = '9.7.0'
}

dependencies {
    // Spring Cloud AWS 4.x BOM
    implementation platform(
            "io.awspring.cloud:spring-cloud-aws-dependencies:${springCloudAwsVersion}"
    )

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Web
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // WebClient만 사용하는 경우
    implementation 'org.springframework.boot:spring-boot-starter-webclient'

    implementation 'org.springframework.boot:spring-boot-starter-restclient'

    // Template
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Database
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Messaging
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // Mail
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // Apache HttpClient 5
    implementation 'org.apache.httpcomponents.client5:httpclient5'

    // OpenAPI / Swagger - Spring Boot 4 지원 버전
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // org.json을 코드에서 직접 사용하는 경우에만 유지
    implementation 'org.json:json:20260522'

    // AWS S3 (spring-cloud-aws BOM으로 SDK 버전 관리)
    implementation platform('software.amazon.awssdk:bom:2.29.11')
    implementation 'software.amazon.awssdk:s3-transfer-manager'
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:aws-crt-client'
    implementation 'io.github.thoroldvix:youtube-transcript-api:0.4.0'
    // 내부 DB 모듈
    implementation project(':db')

    // Spring Boot 4 모듈별 테스트 스타터
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

}

bootJar {
    // 로컬 개발용 자격증명이 운영 이미지에 포함되지 않도록 합니다.
    exclude '**/application-local.yml'
    enabled = true
    mainClass = 'com.orinan.api.ApiApplication'
}

jar {
    enabled = false
}
