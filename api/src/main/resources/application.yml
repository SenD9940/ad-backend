spring:
  application:
    name: ad-backend
  profiles:
    # IDE 실행은 local, 배포 컨테이너는 SPRING_PROFILES_ACTIVE=prod를 사용합니다.
    default: local
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 200MB
  web:
    resources:
      static-locations: classpath:/static/
  jpa:
    properties:
      hibernate:
        # LocalDateTime + DATETIME은 서울 벽시계로 저장합니다. jdbc.time_zone을 추가하지 않습니다.
        format_sql: false

server:
  port: ${SERVER_PORT:8480}
  shutdown: graceful

app:
  support:
    toss:
      client-key: ${TOSS_PAYMENTS_CLIENT_KEY:}
      secret-key: ${TOSS_PAYMENTS_SECRET_KEY:}
  ai-studio:
    worker-enabled: true
    publish-delay-ms: 20000
    analysis-cron: "0 10 1 * * *"
    analysis-zone: Asia/Seoul

token:
  access-token:
    plus-hour: 1
  refresh-token:
    plus-hour: 12

# 기존 서버 앱 설정을 커머스ID 인증·토큰 발급에 사용합니다.
# naver.solution.client-id/client-secret을 명시하면 해당 값이 우선합니다.
# 앱 키만으로 솔루션 등록·팝업 인증 설정을 대신하거나 기능을 활성화하지 않습니다.
naver:
  solution:
    client-id: ${app.naver-commerce.app-id:}
    client-secret: ${app.naver-commerce.app-secret:}

# OAuth 토큰 교환 정보가 HTTP 클라이언트 로그에 남지 않도록 합니다.
logging:
  level:
    org.springframework.web.client.DefaultRestClient: WARN
