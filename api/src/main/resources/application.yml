spring:
  application:
    name: ad-backend
  profiles:
    # IDE 실행은 local, 배포 컨테이너는 SPRING_PROFILES_ACTIVE=prod를 사용합니다.
    default: local
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 200MB
  web:
    resources:
      static-locations: classpath:/static/
  jpa:
    properties:
      hibernate:
        # LocalDateTime + DATETIME은 서울 벽시계로 저장합니다. jdbc.time_zone을 추가하지 않습니다.
        format_sql: false

server:
  port: ${SERVER_PORT:8480}
  shutdown: graceful

app:
  ai-studio:
    worker-enabled: true
    publish-delay-ms: 20000
    analysis-cron: "0 10 1 * * *"
    analysis-zone: Asia/Seoul

token:
  access-token:
    plus-hour: 1
  refresh-token:
    plus-hour: 12

# OAuth 토큰 교환 정보가 HTTP 클라이언트 로그에 남지 않도록 합니다.
logging:
  level:
    org.springframework.web.client.DefaultRestClient: WARN
